# Nginx site used by docker-compose.yml.
# Same as book_tracker.conf, except Gunicorn is reached through the Docker
# network at app:8000 instead of 127.0.0.1:8000.

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location /static/ {
        alias /opt/book_tracker/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        # Resolve "app" through Docker's DNS on every request so Nginx keeps
        # working when the app container restarts and gets a new IP.
        resolver 127.0.0.11 valid=10s;
        set $gunicorn http://app:8000;
        proxy_pass $gunicorn;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

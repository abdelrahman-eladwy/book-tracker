# Nginx site for Book Tracker
#
# Install:
#   sudo cp deploy/nginx/book_tracker.conf /etc/nginx/sites-available/book_tracker
#   sudo ln -s /etc/nginx/sites-available/book_tracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name example.com www.example.com;   # change to your domain or server IP

    client_max_body_size 1m;

    access_log /var/log/nginx/book_tracker.access.log;
    error_log  /var/log/nginx/book_tracker.error.log;

    # Static files collected by `python manage.py collectstatic`
    location /static/ {
        alias /opt/book_tracker/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Everything else goes to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

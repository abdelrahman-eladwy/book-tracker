# Book Tracker: Browser -> Nginx -> Gunicorn -> Django -> MongoDB
#
#   docker compose up -d --build
#
# Only Nginx is published to the host (port 8080). Gunicorn and MongoDB are
# reached by service name on the internal Docker network.

name: book-tracker

services:
  mongo:
    image: mongo:7
    container_name: book-tracker-mongo
    restart: unless-stopped
    env_file: deploy/docker.env
    ports:
      - "127.0.0.1:27017:27017"   # for local tools; remove to keep MongoDB internal
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: book-tracker-app
    restart: unless-stopped
    env_file: deploy/docker.env
    environment:
      GUNICORN_BIND: "0.0.0.0:8000"   # reachable by Nginx as app:8000 (not published to the host)
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - static-files:/opt/book_tracker/staticfiles

  nginx:
    image: nginx:stable
    container_name: book-tracker-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # IPv4 only: on Docker Desktop + WSL2 the IPv6 forward ([::1]:8080) can hang,
      # and browsers try IPv6 first for "localhost".
      - "0.0.0.0:8080:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static-files:/opt/book_tracker/staticfiles:ro

volumes:
  mongo-data:
    name: book-tracker-mongo-data
  static-files:
    name: book-tracker-static
